services:
  assistant:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/assistant.db
      USER_SESSION_FILE: /run/user-session/session.enc
    volumes:
      - assistant-data:/data
      - ./.secrets:/run/user-session:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  assistant-data:

