services:
  - type: web
    name: cryptobot-assistant
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: APP_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOT_TRANSPORT
        value: webhook
      - key: MONITOR_SOURCE
        value: "off"
      - key: TELEGRAM_API_ID
        value: "0"
      - key: TELEGRAM_API_HASH
        value: ""
      - key: USER_SESSION_ENCRYPTED
        value: ""
      - key: P2P_AUTOMATION_AUTHORIZED
        value: "false"
      - key: LIVE_TRADING_ENABLED
        value: "false"

