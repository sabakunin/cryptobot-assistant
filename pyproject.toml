[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot-assistant"
version = "0.3.3"
description = "CryptoBot P2P user client with live Telegram navigation and owner-controlled execution"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "SQLAlchemy[asyncio]>=2.0.40,<3", "alembic>=1.15,<2", "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1", "pydantic-settings>=2.8,<3",
  "cryptography>=44,<48", "Telethon>=1.40,<2", "prometheus-client>=0.21,<1", "qrcode[pil]>=8,<9"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["sniper*"]

[tool.setuptools.package-data]
sniper = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

